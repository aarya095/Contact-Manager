info:
  name: Update contact entry
  type: http
  seq: 4

http:
  method: PUT
  url: http://127.0.0.1:8000/contacts
  body:
    type: json
    data: |-
      {
        "old_contact_name" = "india"
        new_contact_name : "Bharat"
        new_contact_number : 24234
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
