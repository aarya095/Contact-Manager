services:
  web:
    build: .
    env_file:
      - .env.main
    ports:
      - "8000:8000"
    volumes:
      - .:/contacts-manager-app

  db:
    image: postgres:16
    container_name: postgres_container
    restart: always
    env_file:
      - .env.main
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    
volumes:
  pgdata:
  